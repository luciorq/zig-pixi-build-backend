# zig-pixi-build-backend — testbed workspace
#
# This repo validates the pixi-build-zig backend developed on the
# feat/pixi-build-zig branch of the luciorq/pixi fork (../pixi). The backend
# is not published on any channel yet, so every build points pixi at the
# locally built binary via PIXI_BUILD_BACKEND_OVERRIDE.
#
# Build the backend first:   pixi run build-backend
# Then e.g.:                 pixi run build-hello
#                            pixi run cross-hello-aarch64

[workspace]
authors = ["luciorq <luciorqueiroz@gmail.com>"]
channels = ["conda-forge"]
name = "zig-pixi-build-backend"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
# Rebuild the backend binary from the fork checkout.
build-backend = { cmd = "cargo build -p pixi-build-zig", cwd = "../pixi", description = "Build pixi-build-zig from the fork at ../pixi" }

# Native build of the hello-zig example; drops the .conda next to the manifest.
build-hello = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/hello-zig --target-dir dist", description = "Native build of examples/hello-zig through the local backend" }

# Cross builds from this machine. Same-OS cross needs no extra toolchain
# packages: the zig in the build env targets everything.
cross-hello-aarch64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/hello-zig --target-platform linux-aarch64 --target-dir dist", description = "Cross-compile hello-zig for linux-aarch64" }
cross-hello-win64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/hello-zig --target-platform win-64 --target-dir dist", description = "Cross-compile hello-zig for win-64 (MinGW ABI)" }
cross-hello-osx-arm64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/hello-zig --target-platform osx-arm64 --target-dir dist", description = "Cross-compile hello-zig for osx-arm64" }
cross-hello-osx-64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/hello-zig --target-platform osx-64 --target-dir dist", description = "Cross-compile hello-zig for osx-64" }
cross-hello-all = { depends-on = ["build-hello", "cross-hello-aarch64", "cross-hello-win64", "cross-hello-osx-arm64", "cross-hello-osx-64"], description = "Build the full five-platform matrix" }

# zlib-zig: exercises conda host dependencies (--search-prefix), C sources
# compiled by zig's clang, and per-platform link modes.
build-zlib = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zlib-zig --target-dir dist", description = "Native build of examples/zlib-zig through the local backend" }
demo-zlib = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi run --manifest-path examples/zlib-zig/pixi.toml demo", description = "Build, install and run zlib-zig in its workspace env" }
cross-zlib-aarch64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zlib-zig --target-platform linux-aarch64 --target-dir dist", description = "Cross-compile zlib-zig for linux-aarch64" }
cross-zlib-win64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zlib-zig --target-platform win-64 --target-dir dist", description = "Cross-compile zlib-zig for win-64" }
cross-zlib-osx-arm64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zlib-zig --target-platform osx-arm64 --target-dir dist", description = "Cross-compile zlib-zig for osx-arm64 (static libz)" }
cross-zlib-osx-64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zlib-zig --target-platform osx-64 --target-dir dist", description = "Cross-compile zlib-zig for osx-64 (static libz)" }
cross-zlib-all = { depends-on = ["build-zlib", "cross-zlib-aarch64", "cross-zlib-win64", "cross-zlib-osx-arm64", "cross-zlib-osx-64"], description = "Build the full zlib-zig matrix" }

# zon-dep-zig: exercises build.zig.zon dependencies (vendored path dep) and
# zon-derived package metadata (empty [package] table).
build-zon-dep = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zon-dep-zig --target-dir dist", description = "Native build of examples/zon-dep-zig through the local backend" }
demo-zon-dep = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi run --manifest-path examples/zon-dep-zig/pixi.toml demo", description = "Build, install and run zon-dep-zig in its workspace env" }
cross-zon-dep-win64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --path examples/zon-dep-zig --target-platform win-64 --target-dir dist", description = "Cross-compile zon-dep-zig for win-64" }

# greet-zig: producer -> consumer story — a zig-built shared library package
# (libgreet) linked by another package (greet-cli) as a path host-dependency,
# published jointly as a self-contained set.
build-greet = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --target-dir ../../dist", cwd = "examples/greet-zig", description = "Joint native build of libgreet + greet-cli" }
demo-greet = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi run --manifest-path examples/greet-zig/pixi.toml demo", description = "Build, install and run greet-cli in the workspace env" }
cross-greet-win64 = { cmd = "PIXI_BUILD_BACKEND_OVERRIDE=pixi-build-zig=$PIXI_PROJECT_ROOT/../pixi/target/debug/pixi-build-zig pixi publish --target-platform win-64 --target-dir ../../dist", cwd = "examples/greet-zig", description = "Joint win-64 cross build of libgreet + greet-cli" }

# Inspect what landed in dist/.
verify = { cmd = "bash scripts/verify-artifacts.sh", description = "Extract dist/*.conda and report binary formats" }

[dependencies]
# For extracting and inspecting built .conda artifacts.
python = ">=3.12"

