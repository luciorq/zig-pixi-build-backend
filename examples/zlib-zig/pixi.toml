# Test package exercising conda host dependencies with the pixi-build-zig
# backend: a zig executable whose C part #includes <zlib.h> and links libz,
# both resolved from the conda host environment via --search-prefix.

[workspace]
authors = ["luciorq <luciorqueiroz@gmail.com>"]
channels = ["conda-forge"]
name = "zlib-zig"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

# Installing the workspace environment builds zlib-zig from this repo and
# puts the binary on the env PATH (with libz from its run dependencies).
[dependencies]
zlib-zig = { path = "." }

[tasks]
demo = "zlib-zig"

[package]
name = "zlib-zig"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-zig", version = "*" }

[package.build-dependencies]
zig = "0.16.*"

[package.host-dependencies]
zlib = "*"
